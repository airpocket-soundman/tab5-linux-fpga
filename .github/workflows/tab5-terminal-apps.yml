name: tab5-terminal-apps
on:
  push:
    branches: [codex/st7121-display]
    paths:
      - '.github/workflows/tab5-terminal-apps.yml'
      - 'linux/tab5/terminal-apps/**'
      - 'tools/fpga-link/**'
      - 'tools/tab5-console/**'
      - 'linux/tab5/bluetooth/**'
      - 'linux/m3-lab/rootfs-overlay/etc/init.d/S98tab5-touch-scroll'
  workflow_dispatch:
    inputs:
      storage:
        description: 'Internal requires kernel patch 0080; SD uses launchers'
        type: choice
        options: [internal, sd]
        default: internal
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  apps:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TAB5_APPS_JOBS: '4'
      TAB5_APPS_STORAGE: ${{ inputs.storage || 'internal' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install userspace build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git wget file bc cpio rsync unzip patch perl \
            python3 bison flex libncurses-dev libssl-dev libelf-dev texinfo \
            squashfs-tools
      - name: Restore standalone toolchain build cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            work/terminal-apps/br-output
            work/terminal-apps/downloads
          key: ${{ runner.os }}-tab5-nommu-apps-v1-${{ hashFiles('linux/tab5/terminal-apps/defconfig', 'versions.lock.json') }}
      - name: Configure pinned Buildroot and tiny applications
        run: bash linux/tab5/terminal-apps/build.sh prepare 2>&1 | tee prepare.log
      - name: Build static RV32IMAC NOMMU toolchain
        id: toolchain
        run: bash linux/tab5/terminal-apps/build.sh toolchain 2>&1 | tee toolchain.log
      - name: Save completed toolchain cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            work/terminal-apps/br-output
            work/terminal-apps/downloads
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Package reusable toolchain SDK
        run: bash linux/tab5/terminal-apps/build.sh sdk 2>&1 | tee sdk.log
      - name: Save standalone toolchain SDK
        uses: actions/upload-artifact@v4
        with:
          name: tab5-terminal-sdk
          path: artifacts/terminal-sdk/
          compression-level: 0
      - name: Build genuine Vim, nano and sl
        run: bash linux/tab5/terminal-apps/build.sh apps 2>&1 | tee applications.log
      - name: Download original Linux rootfs
        uses: actions/download-artifact@v4
        with:
          name: tab5-assets
          run-id: '39729147095'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: baseline
      - name: Verify baseline and install applications and current board helpers
        run: |
          set -euo pipefail
          python3 linux/tab5/terminal-apps/package.py baseline baseline
          sudo unsquashfs -d rootfs baseline/rootfs.squashfs
          sudo python3 linux/tab5/terminal-apps/package.py install \
            rootfs artifacts/terminal-apps linux/m3-lab/rootfs-overlay "$TAB5_APPS_STORAGE"
          sudo mksquashfs rootfs artifacts/terminal-apps/rootfs.squashfs \
            -noappend -comp lz4 -b 131072 -Xhc
          limit=$((0x700000))
          if [ "$TAB5_APPS_STORAGE" = sd ]; then limit=$((0x400000)); fi
          test "$(stat -c %s artifacts/terminal-apps/rootfs.squashfs)" -le "$limit"
          printf 'storage=%s\ninternal_requires_kernel_patch=0080\n' "$TAB5_APPS_STORAGE" >> artifacts/terminal-apps/build-info.txt
          unsquashfs -s artifacts/terminal-apps/rootfs.squashfs | tee artifacts/terminal-apps/rootfs-info.txt
          grep -q 'Compression lz4' artifacts/terminal-apps/rootfs-info.txt
          for path in etc/init.d/S03loopback usr/sbin/tab5-wifi etc/profile \
            etc/init.d/S30tab5-sdcard etc/init.d/S99tab5-display \
            etc/init.d/S98tab5-touch-scroll; do
            unsquashfs -cat artifacts/terminal-apps/rootfs.squashfs "$path" \
              | cmp - "linux/m3-lab/rootfs-overlay/$path"
          done
          unsquashfs -cat artifacts/terminal-apps/rootfs.squashfs usr/bin/tab5-touch-scroll \
            | cmp - artifacts/terminal-apps/payload/usr/bin/tab5-touch-scroll
          unsquashfs -cat artifacts/terminal-apps/rootfs.squashfs usr/bin/tab5-ble-hid \
            | cmp - artifacts/terminal-apps/payload/usr/bin/tab5-ble-hid
          for app in vim nano sl fpga-link; do
            expected="artifacts/terminal-apps/payload/usr/bin/$app"
            if [ "$TAB5_APPS_STORAGE" = sd ]; then expected=linux/tab5/terminal-apps/launcher.sh; fi
            unsquashfs -cat artifacts/terminal-apps/rootfs.squashfs "usr/bin/$app" | cmp - "$expected"
          done
          (cd artifacts/terminal-apps && sha256sum rootfs.squashfs \
            tab5-terminal-apps.tar.gz applications.json buildroot.config build-info.txt > SHA256SUMS.txt)
      - name: Preserve build logs
        if: always()
        run: |
          mkdir -p artifacts/terminal-apps
          for log in prepare.log toolchain.log sdk.log applications.log; do
            if test -f "$log"; then cp "$log" artifacts/terminal-apps/; fi
          done
      - name: Upload rootfs, applications and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tab5-terminal-apps
          path: artifacts/terminal-apps/
          compression-level: 0
          if-no-files-found: warn
