name: offline-memory
on:
  push:
    paths:
      - 'tools/fpga-memory/**'
      - 'tools/fpga-budget/**'
      - 'tools/fpga-gpu-model/**'
      - 'tools/fpga-link/**'
      - '.github/workflows/offline-memory.yml'
  pull_request:
    paths:
      - 'tools/fpga-memory/**'
      - 'tools/fpga-budget/**'
      - 'tools/fpga-gpu-model/**'
      - 'tools/fpga-link/**'
      - '.github/workflows/offline-memory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Python link, memory, and GPU budget checks (no hardware)
        run: |
          python3 -m unittest discover -s tools/fpga-link -p test_fpga_link.py -v
          python3 -m unittest discover -s tools/fpga-memory -p test_memory_mock.py -v
          python3 -m unittest discover -s tools/fpga-budget -p test_budget.py -v
          python3 -m unittest discover -s tools/fpga-gpu-model -p test_ownership.py -v
      - name: C link compatibility (no hardware)
        run: |
          python3 tools/fpga-link/run_c_codec.py --cc ${{ matrix.cc }}
          python3 tools/fpga-link/run_c_cli.py --cc ${{ matrix.cc }}
      - name: Large-data tiled mock and analytical budget
        run: |
          python3 tools/fpga-memory/memory_mock.py --mock --size 67108864 --transfer-limit 65536
          python3 tools/fpga-budget/budget.py --width 720 --height 1280 --available-readback-bps 20000000
      - name: Checkout the reviewed MeOS host core at a fixed revision
        uses: actions/checkout@v4
        with:
          repository: airpocket-soundman/tab5-meos-fpga
          ref: 7d14d858ea5045767799c9a8622ced16e35c2947
          path: companion-meos
          persist-credentials: false
      - name: Cross-implementation data conformance (no OS runtime or hardware)
        run: python3 tools/fpga-memory/compare_meos.py --meos-root companion-meos --cc ${{ matrix.cc }}
