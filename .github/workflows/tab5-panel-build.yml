# Fast display iteration using the already built, patched kernel source.
# Debian's cross compiler may produce an Image incompatible with the
# esp32_sdio.ko shipped in the original rootfs; use USB serial for testing.
name: tab5-panel-build
on:
  push:
    branches: [codex/st7121-display]
    paths:
      - '.github/workflows/tab5-panel-build.yml'
      - 'linux/kernel-patches/0077-drm-panel-sitronix-st7121.patch'
      - 'linux/kernel-patches/0078-dwc2-esp32p4-usb20-host-pio.patch'
      - 'linux/kernel-patches/0079-spi-gpio-honor-delay.patch'
      - 'linux/kernel-patches/0080-physmap-rom-preserve-resource-size.patch'
      - 'linux/kernel-patches/0081-input-tab5-st712x-touch.patch'
      - 'linux/kernel-patches/0082-tab5-vt-scrollback.patch'
      - 'linux/dts/tab5-touch.dtsi'
      - 'linux/tab5/touch.config.fragment'
      - 'linux/dts/tab5-usb-host.dtsi'
      - 'linux/dts/tab5-microsd-spi.dtsi'
      - 'linux/tab5/usb-host-boot-symbols.json'
      - 'linux/tab5/microsd-spi.config.fragment'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ARCH: riscv
      CROSS_COMPILE: riscv64-linux-gnu-
      KIT_RUN_ID: '39729147095'
    steps:
      - uses: actions/checkout@v4
      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-riscv64-linux-gnu build-essential bc bison flex \
            libssl-dev libelf-dev device-tree-compiler zstd python3 cpio kmod
      - name: Download baseline kernel kit
        uses: actions/download-artifact@v4
        with:
          name: tab5-kernel-kit
          run-id: ${{ env.KIT_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: kit
      - name: Prepare ST7121, USB host and microSD kernel and device tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/obj artifacts
          tar --zstd -xf kit/linux-tree.tar.zst -C work
          test -f work/linux-custom/Makefile
          cp kit/kernel.config work/obj/.config
          patch --batch --forward -d work/linux-custom -p1 \
            < linux/kernel-patches/0077-drm-panel-sitronix-st7121.patch
          patch --batch --forward -d work/linux-custom -p1 \
            < linux/kernel-patches/0078-dwc2-esp32p4-usb20-host-pio.patch
          patch --batch --forward -d work/linux-custom -p1 \
            < linux/kernel-patches/0079-spi-gpio-honor-delay.patch
          patch --batch --forward -d work/linux-custom -p1 \
            < linux/kernel-patches/0080-physmap-rom-preserve-resource-size.patch
          patch --batch --forward -d work/linux-custom -p1 \
            < linux/kernel-patches/0081-input-tab5-st712x-touch.patch
          patch --batch --forward -d work/linux-custom -p1 \
            < linux/kernel-patches/0082-tab5-vt-scrollback.patch
          python3 - <<'PY'
          from pathlib import Path
          path = Path('work/linux-custom/arch/riscv/boot/dts/espressif/easystick-stamp-p4.dts')
          text = path.read_text()
          old = 'compatible = "sitronix,st7123";'
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one ST7123 panel node in kit DTS')
          path.write_text(text.replace(old, 'compatible = "sitronix,st7121";'))
          PY
          cat linux/dts/tab5-usb-host.dtsi \
            >> work/linux-custom/arch/riscv/boot/dts/espressif/easystick-stamp-p4.dts
          cat linux/dts/tab5-microsd-spi.dtsi \
            >> work/linux-custom/arch/riscv/boot/dts/espressif/easystick-stamp-p4.dts
          cat linux/dts/tab5-touch.dtsi \
            >> work/linux-custom/arch/riscv/boot/dts/espressif/easystick-stamp-p4.dts
          work/linux-custom/scripts/config --file work/obj/.config \
            --enable USB --enable HID_SUPPORT --enable HID --enable HID_GENERIC \
            --enable USB_HID --enable USB_DWC2_HOST \
            --disable USB_DWC2_PERIPHERAL --disable USB_DWC2_DUAL_ROLE \
            --enable TAB5_VT_SCROLLBACK
          python3 - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          fragment = Path('linux/tab5/microsd-spi.config.fragment')
          touch_fragment = Path('linux/tab5/touch.config.fragment')
          options = []
          for line in (fragment.read_text() + '\n' + touch_fragment.read_text()).splitlines():
              line = line.strip()
              if not line or line.startswith('#'):
                  continue
              match = re.fullmatch(r'CONFIG_([A-Z0-9_]+)=y', line)
              if not match:
                  raise SystemExit(f'Unsupported microSD config line: {line}')
              options.append(match[1])
          options = list(dict.fromkeys(options))
          if not options:
              raise SystemExit('Required config fragments are empty')
          args = ['work/linux-custom/scripts/config', '--file', 'work/obj/.config']
          for option in options:
              args.extend(['--enable', option])
          subprocess.run(args, check=True)
          Path('artifacts/microsd-required-config.txt').write_text('\n'.join(options) + '\n')
          PY
          {
            printf 'source_commit=%s\n' "$GITHUB_SHA"
            printf 'baseline_kit_run=%s\n' "$KIT_RUN_ID"
            printf 'kernel_flash_offset=0x90000\n'
            printf 'dtb_flash_offset=0xf10000\n'
            printf 'module_compatibility=unverified_with_baseline_rootfs\n'
            riscv64-linux-gnu-gcc --version
            sha256sum kit/kernel.config kit/linux-tree.tar.zst \
              linux/kernel-patches/0077-drm-panel-sitronix-st7121.patch \
              linux/kernel-patches/0078-dwc2-esp32p4-usb20-host-pio.patch \
              linux/kernel-patches/0079-spi-gpio-honor-delay.patch \
              linux/kernel-patches/0080-physmap-rom-preserve-resource-size.patch \
              linux/kernel-patches/0081-input-tab5-st712x-touch.patch \
              linux/kernel-patches/0082-tab5-vt-scrollback.patch \
              linux/dts/tab5-touch.dtsi linux/tab5/touch.config.fragment \
              linux/dts/tab5-usb-host.dtsi linux/dts/tab5-microsd-spi.dtsi \
              linux/tab5/microsd-spi.config.fragment
          } > artifacts/build-info.txt
      - name: Match kernel C68 addresses to USB host boot shim
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee artifacts/boot-symbol-relocation.log
          import json
          import re
          from pathlib import Path

          manifest = Path('linux/tab5/usb-host-boot-symbols.json')
          data = json.loads(manifest.read_text())
          if not re.fullmatch(r'[0-9a-fA-F]{64}', data['elf_sha256']):
              raise SystemExit('Invalid boot-shim ELF SHA-256')
          old = {'release': 0x4ff13f1c, 'stage': 0x4ff13f18}
          new = {}
          for key in old:
              value = data[f'new_{key}']
              new[key] = int(value, 0) if isinstance(value, str) else int(value)
              if not (0x4ff00000 <= new[key] < 0x50000000) or new[key] % 4:
                  raise SystemExit(f'Invalid aligned boot-shim IRAM address: {key}')
              if f'old_{key}' in data:
                  value = data[f'old_{key}']
                  value = int(value, 0) if isinstance(value, str) else int(value)
                  if value != old[key]:
                      raise SystemExit(f'Baseline kit address mismatch: {key}')
          if new['release'] == new['stage']:
              raise SystemExit('Release and stage addresses must differ')
          pending = {}
          for filename in ('cpu_ops_spinwait.c', 'smpboot.c'):
              path = Path('work/linux-custom/arch/riscv/kernel') / filename
              text = path.read_text()
              for key in old:
                  macro = f'EASYSTICK_C68_{key.upper()}_PA'
                  pattern = rf'(^#define\s+{macro}\s+)(0x[0-9a-fA-F]+)[uU](\s*)$'
                  matches = list(re.finditer(pattern, text, re.MULTILINE))
                  if len(matches) != 1 or int(matches[0].group(2), 16) != old[key]:
                      raise SystemExit(f'Unexpected baseline macro: {filename} {macro}')
                  text = re.sub(pattern, lambda m: f'{m[1]}0x{new[key]:08x}u{m[3]}',
                                text, flags=re.MULTILINE)
                  print(f'{filename} {macro}: 0x{old[key]:08x} -> 0x{new[key]:08x}')
              pending[path] = text
          for path, text in pending.items():
              path.write_text(text)
          Path('artifacts/usb-host-boot-symbols.json').write_text(manifest.read_text())
          print(f'Expected boot-shim ELF SHA-256: {data["elf_sha256"]}')
          PY
      - name: Build kernel and device tree
        shell: bash
        run: |
          set -euo pipefail
          make -C work/linux-custom O="$GITHUB_WORKSPACE/work/obj" olddefconfig \
            2>&1 | tee artifacts/configure.log
          for option in USB HID_SUPPORT HID HID_GENERIC USB_HID USB_DWC2_HOST TAB5_VT_SCROLLBACK; do
            grep -Fxq "CONFIG_${option}=y" work/obj/.config || {
              echo "Required kernel option was disabled: $option" >&2
              exit 1
            }
          done
          while IFS= read -r option; do
            grep -Fxq "CONFIG_${option}=y" work/obj/.config || {
              echo "Required microSD option was disabled: $option" >&2
              exit 1
            }
          done < artifacts/microsd-required-config.txt
          if grep -Eq '^CONFIG_USB_DWC2_(PERIPHERAL|DUAL_ROLE)=y$' work/obj/.config; then
            echo 'DWC2 must use host-only mode for this experiment' >&2
            exit 1
          fi
          make -C work/linux-custom O="$GITHUB_WORKSPACE/work/obj" \
            -j"$(nproc)" Image dtbs 2>&1 | tee artifacts/build.log
      - name: Verify and package kernel artifacts
        shell: bash
        run: |
          set -euo pipefail
          image=work/obj/arch/riscv/boot/Image
          dtb=work/obj/arch/riscv/boot/dts/espressif/easystick-stamp-p4.dtb
          test -s "$image"
          test -s "$dtb"
          image_size=$(stat -c %s "$image")
          dtb_size=$(stat -c %s "$dtb")
          (( image_size <= 0x780000 )) || { echo "Image exceeds kernel partition" >&2; exit 1; }
          (( dtb_size <= 0x10000 )) || { echo "DTB exceeds dtb partition" >&2; exit 1; }
          dtc -I dtb -O dts "$dtb" -o artifacts/easystick-stamp-p4.dts
          grep -Fq 'sitronix,st7121' artifacts/easystick-stamp-p4.dts
          grep -Fq 'espressif,esp32p4-otg20' artifacts/easystick-stamp-p4.dts
          grep -Fq 'mmc-spi-slot' artifacts/easystick-stamp-p4.dts
          grep -Fq 'spi-gpio' artifacts/easystick-stamp-p4.dts
          grep -Fq 'm5stack,tab5-st712x' artifacts/easystick-stamp-p4.dts
          cp "$image" artifacts/Image
          cp "$dtb" artifacts/easystick-stamp-p4.dtb
          cp work/obj/.config artifacts/kernel.config
          cp linux/kernel-patches/0077-drm-panel-sitronix-st7121.patch artifacts/
          cp linux/kernel-patches/0078-dwc2-esp32p4-usb20-host-pio.patch artifacts/
          cp linux/kernel-patches/0079-spi-gpio-honor-delay.patch artifacts/
          cp linux/kernel-patches/0080-physmap-rom-preserve-resource-size.patch artifacts/
          cp linux/dts/tab5-usb-host.dtsi artifacts/
          cp linux/dts/tab5-microsd-spi.dtsi artifacts/
          cp linux/tab5/microsd-spi.config.fragment artifacts/
          cp linux/kernel-patches/0081-input-tab5-st712x-touch.patch artifacts/
          cp linux/kernel-patches/0082-tab5-vt-scrollback.patch artifacts/
          cp linux/dts/tab5-touch.dtsi artifacts/
          cp linux/tab5/touch.config.fragment artifacts/
          printf 'Image_bytes=%s\nDTB_bytes=%s\n' "$image_size" "$dtb_size" \
            >> artifacts/build-info.txt
          (cd artifacts && sha256sum Image easystick-stamp-p4.dtb kernel.config \
            0077-drm-panel-sitronix-st7121.patch \
            0078-dwc2-esp32p4-usb20-host-pio.patch \
            0079-spi-gpio-honor-delay.patch \
            0080-physmap-rom-preserve-resource-size.patch tab5-usb-host.dtsi tab5-microsd-spi.dtsi \
            0081-input-tab5-st712x-touch.patch 0082-tab5-vt-scrollback.patch \
            tab5-touch.dtsi touch.config.fragment \
            microsd-spi.config.fragment microsd-required-config.txt \
            usb-host-boot-symbols.json > SHA256SUMS.txt)
          cat artifacts/SHA256SUMS.txt
      - name: Upload kernel and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tab5-st7121-kernel
          path: artifacts/
          if-no-files-found: warn
