<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="330" viewBox="0 0 1120 330" role="img" aria-labelledby="title"><title id="title">FPGA GPUからTab5液晶までの構成案</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#18594c" stroke-width="1.5"/></marker></defs><rect width="1120" height="330" rx="12" fill="#e8ede4"/><g font-family="sans-serif" fill="#18343b"><text x="30" y="42" font-size="20" font-weight="bold">GPU構成と表示経路 / 検討案</text><rect x="30" y="77" width="270" height="82" rx="8" fill="#fff"/><text x="50" y="110" font-size="18">P4 / アプリ・Linux</text><text x="50" y="138" font-size="14">初期の変換・投影 / 描画要求</text><rect x="420" y="77" width="270" height="82" rx="8" fill="#fff"/><text x="440" y="110" font-size="18">FPGA / 描画エンジン</text><text x="440" y="138" font-size="14">FIFO / ラスタライザ / 仲裁</text><rect x="810" y="77" width="280" height="82" rx="8" fill="#d9ed95"/><text x="830" y="110" font-size="18">DDR3 / VRAM</text><text x="830" y="138" font-size="14">color・depth・素材</text><path d="M310 118H404M700 118H794" stroke="#18594c" stroke-width="2" marker-end="url(#a)"/><text x="360" y="98" font-size="13" text-anchor="middle">命令</text><text x="750" y="98" font-size="13" text-anchor="middle">描画</text><path d="M950 169V215H165V169" stroke="#18594c" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="560" y="200" font-size="15" text-anchor="middle">完了後にcolorをREADBACK / 転送帯域が表示性能を制約</text><rect x="30" y="250" width="1060" height="52" rx="8" fill="#dce4d8"/><text x="55" y="282" font-size="16">P4側の画像バッファ → 既存の表示経路 → Tab5液晶 （FPGAからの直接出力は想定しない）</text></g></svg>