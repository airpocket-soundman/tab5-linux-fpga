<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="240" viewBox="0 0 1120 240" role="img" aria-labelledby="title"><title id="title">明示的なデータ転送の概念図</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#18594c" stroke-width="1.5"/></marker></defs><rect width="1120" height="240" rx="12" fill="#e8ede4"/><g font-family="sans-serif" fill="#18343b" text-anchor="middle"><rect x="30" y="55" width="220" height="92" rx="8" fill="#fff"/><text x="140" y="90" font-size="17" font-weight="bold">01 アプリが要求</text><text x="140" y="120" font-size="14">READ / WRITE</text><rect x="310" y="55" width="220" height="92" rx="8" fill="#fff"/><text x="420" y="90" font-size="17" font-weight="bold">02 ドライバが転送</text><text x="420" y="120" font-size="14">コマンド・データ</text><rect x="590" y="55" width="220" height="92" rx="8" fill="#fff"/><text x="700" y="90" font-size="17" font-weight="bold">03 FPGAが処理</text><text x="700" y="120" font-size="14">DDR3に保存 / 演算</text><rect x="870" y="55" width="220" height="92" rx="8" fill="#d9ed95"/><text x="980" y="90" font-size="17" font-weight="bold">04 結果を返す</text><text x="980" y="120" font-size="14">完了通知・データ</text><text x="560" y="205" font-size="14">プロトコルは設計前の概念です。タイムアウト・CRC・キャッシュ同期も検証します。</text></g><g stroke="#18594c" stroke-width="2" marker-end="url(#a)"><path d="M260 100H295"/><path d="M540 100H575"/><path d="M820 100H855"/></g></svg>