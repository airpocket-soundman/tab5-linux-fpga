<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="450" viewBox="0 0 1120 450" role="img" aria-labelledby="title desc"><title id="title">Tab5 LinuxとFPGAの構成案</title><desc id="desc">Tab5内のアプリとLinuxドライバからPARLIOを経由してFPGAの制御回路とDDR3へ。PARLIOは未検証。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto-start-reverse"><path d="M0 0L6 3L0 6" fill="none" stroke="#18594c" stroke-width="1.5"/></marker></defs><rect width="1120" height="450" rx="12" fill="#e8ede4"/><g font-family="sans-serif" fill="#18343b"><text x="35" y="43" font-size="14" letter-spacing="2">SYSTEM ARCHITECTURE / 構成案</text><rect x="35" y="75" width="420" height="267" rx="14" fill="#fff" stroke="#b9c9bd"/><text x="60" y="112" font-size="23" font-weight="bold">M5Stack Tab5</text><text x="60" y="139" font-size="14">ESP32-P4 / NOMMU Linux / 1コア基準</text><rect x="60" y="166" width="370" height="58" rx="7" fill="#e6ece1"/><text x="80" y="201" font-size="18">研究アプリ・ユーザー空間</text><path d="M245 229V250" stroke="#18594c" stroke-width="2" marker-end="url(#a)"/><rect x="60" y="263" width="370" height="54" rx="7" fill="#18343b"/><text x="80" y="297" font-size="17" fill="#fff">FPGA通信ドライバ / 開発目標</text><rect x="695" y="75" width="390" height="267" rx="14" fill="#fff" stroke="#b9c9bd"/><text x="720" y="112" font-size="23" font-weight="bold">Tang Primer 20K</text><text x="720" y="139" font-size="14">FPGA / 回路と評価は研究側で管理</text><rect x="720" y="166" width="340" height="58" rx="7" fill="#e6ece1"/><text x="740" y="201" font-size="18">コマンド処理・演算回路（構想）</text><path d="M890 229V250" stroke="#18594c" stroke-width="2" marker-end="url(#a)"/><rect x="720" y="263" width="340" height="54" rx="7" fill="#d9ed95"/><text x="740" y="297" font-size="18">128MB DDR3 / 外部データ領域</text><path d="M470 275H678" stroke="#18594c" stroke-width="3" stroke-dasharray="8 6" marker-start="url(#a)" marker-end="url(#a)"/><text x="575" y="202" text-anchor="middle" font-size="17" font-weight="bold">8bit PARLIO</text><text x="575" y="228" text-anchor="middle" font-size="14">+ 制御線 / 初期案</text><text x="575" y="315" text-anchor="middle" font-size="13">GPIO・DMAは未確定</text><rect x="35" y="366" width="420" height="49" rx="7" fill="#dce4d8"/><text x="58" y="397" font-size="15">ESP32-C6 ← SDIO → P4 / Wi-Fi担当</text><text x="695" y="390" font-size="14">DDR3を通常の主記憶としては扱わない</text><text x="695" y="413" font-size="13">配線・電源はキャリア共通仕様で照合</text></g></svg>