<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="400" viewBox="0 0 1120 400" role="img" aria-labelledby="title"><title id="title">FPGA側RAMの用途とP4作業領域</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto-start-reverse"><path d="M0 0L6 3L0 6" fill="none" stroke="#18594c" stroke-width="1.5"/></marker></defs><rect width="1120" height="400" rx="12" fill="#e8ede4"/><g font-family="sans-serif" fill="#18343b"><text x="30" y="42" font-size="20" font-weight="bold">外部RAMの利用案 / 主目的</text><rect x="30" y="72" width="310" height="212" rx="12" fill="#fff"/><text x="52" y="108" font-size="20" font-weight="bold">P4 / NOMMU Linux</text><text x="52" y="142" font-size="15">アプリ・管理情報・ドライバ</text><rect x="52" y="166" width="266" height="90" rx="7" fill="#dce7ca"/><text x="72" y="199" font-size="17">小容量の作業バッファ</text><text x="72" y="231" font-size="14">例：64KiB × 入出力2面</text><path d="M355 207H505" stroke="#18594c" stroke-width="3" stroke-dasharray="8 6" marker-start="url(#a)" marker-end="url(#a)"/><text x="430" y="158" text-anchor="middle" font-size="15">明示的な</text><text x="430" y="183" text-anchor="middle" font-size="15">READ / WRITE</text><text x="430" y="246" text-anchor="middle" font-size="13">通信・DMAは未検証</text><rect x="525" y="72" width="565" height="212" rx="12" fill="#fff"/><text x="550" y="108" font-size="20" font-weight="bold">FPGA側DDR3 / 128MBの外部領域</text><rect x="550" y="130" width="515" height="59" rx="7" fill="#d9ed95"/><text x="573" y="166" font-size="18">大容量データ・退避対象・履歴</text><rect x="550" y="201" width="515" height="59" rx="7" fill="#18343b"/><text x="573" y="237" font-size="17" fill="#fff">演算の入力・中間・出力 / GPU用VRAM</text><text x="30" y="329" font-size="16">評価：扱えるデータ総量 / P4最大常駐量 / 正しさ / 転送量 / 全体処理時間</text><text x="30" y="365" font-size="14">用途別の構成案。領域分割は固定せず、GPUとの同時搭載・データ保持は前提にしない。</text></g></svg>